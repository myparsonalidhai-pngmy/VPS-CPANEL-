<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHAPPNO VPS — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ac:#ef4444;--ac-dim:#ef444488;--ac-lite:#ef444411;}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#05000a;font-family:'JetBrains Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
    canvas{position:fixed;inset:0;z-index:0}
    .mode-tag{position:fixed;top:14px;right:18px;font-size:10px;letter-spacing:3px;color:var(--ac-dim);z-index:10;transition:color .1s linear}
    .container{position:relative;z-index:10;width:100%;max-width:380px;padding:0 16px}
    .card{background:#0a0008;border:2px solid var(--ac);border-radius:16px;padding:34px 30px;box-shadow:0 0 40px var(--ac-lite),0 0 90px var(--ac-lite);transition:border-color .1s linear,box-shadow .1s linear;animation:floatIn .6s ease both}
    @keyframes floatIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .avatar-wrap{width:150px;height:150px;margin:0 auto 18px;position:relative}
    .avatar{width:100%;height:100%;border-radius:50%;border:3px solid var(--ac);box-shadow:0 0 24px var(--ac-dim),0 0 50px var(--ac-lite),inset 0 0 20px rgba(0,0,0,.4);background:radial-gradient(circle at 35% 30%,#3a0a3a,#0a0214 70%);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:border-color .1s linear,box-shadow .1s linear}
    .avatar svg{width:62%;height:62%;filter:drop-shadow(0 0 8px var(--ac));transition:filter .1s linear}
    .avatar-badge{position:absolute;bottom:6px;left:2px;width:34px;height:34px;background:#0a0008;border:2px solid var(--ac);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:var(--ac);box-shadow:0 0 12px var(--ac-dim);transition:border-color .1s linear,color .1s linear,box-shadow .1s linear}
    .brand{text-align:center;font-size:24px;font-weight:800;color:var(--ac);letter-spacing:4px;text-shadow:0 0 14px var(--ac);transition:color .1s linear,text-shadow .1s linear}
    .sub{text-align:center;font-size:11px;color:var(--ac-dim);letter-spacing:3px;margin-top:6px;margin-bottom:22px;transition:color .1s linear}
    .prompt{font-size:13px;color:var(--ac);margin-bottom:16px;opacity:.9;display:flex;align-items:center;gap:4px;transition:color .1s linear}
    .cursor{display:inline-block;width:9px;height:14px;background:var(--ac);margin-left:2px;vertical-align:middle;animation:blink 1s step-end infinite;transition:background .1s linear}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    .error-box{background:#2a0808;border:1px solid #ef4444;border-radius:8px;padding:10px 14px;font-size:12px;color:#f87171;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    input{width:100%;padding:13px 14px;background:#0d000d;border:1px solid var(--ac-dim);border-radius:9px;color:var(--ac);font-family:'JetBrains Mono',monospace;font-size:14px;outline:none;margin-bottom:12px;box-shadow:inset 0 0 10px var(--ac-lite);transition:border-color .1s linear,color .1s linear,box-shadow .1s linear}
    input:focus{border-color:var(--ac)}
    input::placeholder{color:var(--ac-dim);transition:color .1s linear}
    .pw-wrap{position:relative;margin-bottom:22px}
    .pw-wrap input{margin-bottom:0;padding-right:44px}
    .eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ac-dim);font-size:16px;padding:0;transition:color .1s linear}
    .auth-btn{width:100%;padding:14px;background:transparent;border:2px solid var(--ac);border-radius:9px;color:var(--ac);font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;letter-spacing:2px;cursor:pointer;box-shadow:0 0 14px var(--ac-lite);transition:all .1s linear}
    .auth-btn:hover{background:var(--ac-lite);box-shadow:0 0 26px var(--ac-dim)}
    .footer{text-align:center;margin-top:24px;font-size:10px;color:var(--ac-dim);letter-spacing:1px;line-height:1.8;opacity:.55;transition:color .1s linear}
  </style>
</head>
<body>
  <canvas id="matrix">_</canvas>
  <div class="mode-tag" id="modeTag">MATRIX MODE</div>
  <div class="container">
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L4 6V12C4 16.5 7.5 20.5 12 22C16.5 20.5 20 16.5 20 12V6L12 2Z" stroke="var(--ac)" stroke-width="1.4" fill="none"/>
            <path d="M9 12L11 14L15.5 9.5" stroke="var(--ac)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="avatar-badge">S</div>
      </div>
      <div class="brand">SHAPPNO VPS</div>
      <div class="sub">SECURE TERMINAL V2.3</div>
      <div class="prompt">$&gt; LOGIN_REQUIRED<span class="cursor"></span></div>
      {% if error %}
      <div class="error-box">▲ {{ error }}</div>
      {% endif %}
      <form method="POST">
        <input type="text" name="username" placeholder="Username" required autocomplete="username">
        <div class="pw-wrap">
          <input type="password" name="password" placeholder="Enter Access Password" id="pw" autocomplete="current-password">
          <button type="button" class="eye-btn" onclick="togglePw()">👁</button>
        </div>
        <button type="submit" class="auth-btn">&gt;_ AUTHENTICATE</button>
      </form>
      <div class="footer">⚠ UNAUTHORIZED ACCESS PROHIBITED<br>SHAPPNO SECURE SYSTEMS</div>
    </div>
  </div>
  <script>
    // ─── Matrix rain background ───────────────────────────────────────────────
    const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d');
    canvas.width=window.innerWidth;canvas.height=window.innerHeight;
    const chars='アイウエオカキクケコ01SHAPPNOVPS';
    const cols=Math.floor(canvas.width/16),drops=Array(cols).fill(1);
    window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
    function togglePw(){const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';}

    // ─── Global color cycle: every 0.10s everywhere (login + dashboard) ──────
    let hue=0;
    function applyColor(){
      hue=(hue+6)%360;
      const ac=`hsl(${hue},90%,58%)`;
      const dim=`hsla(${hue},90%,58%,0.55)`;
      const lite=`hsla(${hue},90%,58%,0.10)`;
      const root=document.documentElement.style;
      root.setProperty('--ac',ac);
      root.setProperty('--ac-dim',dim);
      root.setProperty('--ac-lite',lite);
    }
    setInterval(applyColor,100);
    applyColor();

    setInterval(()=>{
      const AC=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
      ctx.fillStyle='rgba(5,0,10,0.07)';ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle=AC;ctx.font='13px JetBrains Mono,monospace';ctx.globalAlpha=0.22;
      for(let i=0;i<drops.length;i++){ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*16,drops[i]*16);if(drops[i]*16>canvas.height&&Math.random()>.975)drops[i]=0;drops[i]++;}
      ctx.globalAlpha=1;
    },55);
  </script>
</body>
</html>
